[package]
name = "private-relay-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
private-relay-protocol = { path = "../crates/protocol" }
private-relay-crypto = { path = "../crates/crypto" }
private-relay-network = { path = "../crates/network" }
private-relay-cli = { path = "../crates/cli" }

[[bin]]
name = "fuzz_cell_decoder"
path = "fuzz_targets/fuzz_cell_decoder.rs"
doc = false

[[bin]]
name = "fuzz_frame_decoder"
path = "fuzz_targets/fuzz_frame_decoder.rs"
doc = false

[[bin]]
name = "fuzz_fragment_reassembly"
path = "fuzz_targets/fuzz_fragment_reassembly.rs"
doc = false

[[bin]]
name = "fuzz_http_response"
path = "fuzz_targets/fuzz_http_response.rs"
doc = false

[[bin]]
name = "fuzz_config_parser"
path = "fuzz_targets/fuzz_config_parser.rs"
doc = false

[[bin]]
name = "fuzz_noise_handshake"
path = "fuzz_targets/fuzz_noise_handshake.rs"
doc = false
