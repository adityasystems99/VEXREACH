apiVersion: apps/v1
kind: Deployment
metadata:
  name: private-relay-entry
  namespace: private-relay
  labels:
    app.kubernetes.io/name: private-relay
    app.kubernetes.io/component: entry
spec:
  # Single replica required in v0.1: static X25519 identity and stateful CircuitTable live per Pod.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: private-relay
      app.kubernetes.io/component: entry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: private-relay
        app.kubernetes.io/component: entry
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relay-entry
          image: private-relay:v0.1
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/relay-entry"]
          args: ["--config", "/cfg/entry.toml", "--metrics-addr", "0.0.0.0:9091", "--log-level", "info"]
          ports:
            - name: relay-entry
              containerPort: 9101
              protocol: TCP
            - name: metrics
              containerPort: 9091
              protocol: TCP
          startupProbe:
            exec:
              command:
                - /usr/local/bin/relay-client
                - --probe-noise
                - 127.0.0.1:9101
                - --pubkey-toml
                - /cfg/entry.toml
            initialDelaySeconds: 1
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 10
          readinessProbe:
            exec:
              command:
                - /usr/local/bin/relay-client
                - --probe-noise
                - 127.0.0.1:9101
                - --pubkey-toml
                - /cfg/entry.toml
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                ["/usr/local/bin/relay-client", "--probe", "127.0.0.1:9101"]
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          volumeMounts:
            - name: entry-config
              mountPath: /cfg
              readOnly: true
            - name: entry-secret
              mountPath: /run/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: entry-config
          configMap:
            name: private-relay-entry-config
            defaultMode: 0440
        - name: entry-secret
          secret:
            secretName: private-relay-entry-secret
            defaultMode: 0440
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
