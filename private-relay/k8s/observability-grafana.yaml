apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: private-relay
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: private-relay
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: private-relay
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: grafana/grafana:11.1.0
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards-prov
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-prov
          configMap:
            name: grafana-dashboards-provisioning
        - name: dashboards
          configMap:
            name: grafana-dashboard-private-relay
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: private-relay
  labels:
    app.kubernetes.io/name: grafana
spec:
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: private-relay
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provisioning
  namespace: private-relay
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-private-relay
  namespace: private-relay
data:
  private-relay.json: |
    {
      "annotations": { "list": [] },
      "editable": false,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "title": "Active Circuits",
          "type": "stat",
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 0 },
          "targets": [{ "expr": "sum(private_relay_active_circuits)", "legendFormat": "Active" }]
        },
        {
          "title": "Active TCP Links",
          "type": "stat",
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 0 },
          "targets": [{ "expr": "sum(private_relay_active_connections)", "legendFormat": "Links" }]
        },
        {
          "title": "Total Requests",
          "type": "stat",
          "gridPos": { "h": 6, "w": 6, "x": 12, "y": 0 },
          "targets": [{ "expr": "sum(private_relay_requests_total)", "legendFormat": "Requests" }]
        },
        {
          "title": "SSRF Policy Denials",
          "type": "stat",
          "gridPos": { "h": 6, "w": 6, "x": 18, "y": 0 },
          "targets": [{ "expr": "sum(private_relay_ssrf_denials_total)", "legendFormat": "Blocked" }]
        },
        {
          "title": "Traffic Volume (Frames / sec)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "targets": [
            { "expr": "rate(private_relay_frames_received_total[1m])", "legendFormat": "Frames Recv {{role}}" },
            { "expr": "rate(private_relay_frames_sent_total[1m])", "legendFormat": "Frames Sent {{role}}" }
          ]
        },
        {
          "title": "Request & Error Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "targets": [
            { "expr": "rate(private_relay_requests_success_total[1m])", "legendFormat": "Success" },
            { "expr": "rate(private_relay_requests_failed_total[1m])", "legendFormat": "Failed" },
            { "expr": "rate(private_relay_timeouts_total[1m])", "legendFormat": "Timeouts" }
          ]
        }
      ],
      "refresh": "5s",
      "schemaVersion": 39,
      "tags": ["private-relay", "privacy", "metrics"],
      "timezone": "browser",
      "title": "Private Relay v0.1 — Privacy-Preserving Operations",
      "version": 1
    }
