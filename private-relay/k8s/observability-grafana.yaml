apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: private-relay
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: grafana
    app.kubernetes.io/part-of: private-relay
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/component: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: grafana
        app.kubernetes.io/part-of: private-relay
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: grafana/grafana:11.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "private-relay-local"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_PATHS_DATA
              value: "/var/lib/grafana"
            - name: GF_PATHS_LOGS
              value: "/tmp/grafana-logs"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboards-prov
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /etc/grafana/dashboards
              readOnly: true
            - name: data
              mountPath: /var/lib/grafana
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
            defaultMode: 0440
        - name: dashboards-prov
          configMap:
            name: grafana-dashboards-provisioning
            defaultMode: 0440
        - name: dashboards
          configMap:
            name: grafana-dashboard-private-relay
            defaultMode: 0440
        - name: data
          emptyDir:
            sizeLimit: 128Mi
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: private-relay
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: grafana
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: private-relay
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus.private-relay.svc.cluster.local:9090
        isDefault: true
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provisioning
  namespace: private-relay
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: grafana
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: "default"
        orgId: 1
        folder: ""
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /etc/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-private-relay
  namespace: private-relay
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: grafana
data:
  private-relay.json: |
    {
      "uid": "private-relay-v01",
      "annotations": { "list": [] },
      "editable": false,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "title": "1. Relay Health (Up)",
          "type": "stat",
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "sum(private_relay_up)", "legendFormat": "Healthy Relays" }]
        },
        {
          "title": "2. Active Circuits",
          "type": "stat",
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "sum(private_relay_active_circuits)", "legendFormat": "Active Circuits" }]
        },
        {
          "title": "3. Rejected SSRF Requests",
          "type": "stat",
          "gridPos": { "h": 5, "w": 6, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "sum(private_relay_ssrf_denials_total)", "legendFormat": "SSRF Blocked" }]
        },
        {
          "title": "4. Relay Restarts & Uptime (seconds)",
          "type": "stat",
          "gridPos": { "h": 5, "w": 6, "x": 18, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "private_relay_process_uptime_seconds", "legendFormat": "Uptime {{role}}" }
          ]
        },
        {
          "title": "5. Request Rate (req/s)",
          "type": "timeseries",
          "gridPos": { "h": 7, "w": 8, "x": 0, "y": 5 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "rate(private_relay_requests_total[1m])", "legendFormat": "Total {{role}}" },
            { "expr": "rate(private_relay_requests_success_total[1m])", "legendFormat": "Success {{role}}" }
          ]
        },
        {
          "title": "6. Error Rate (err/s)",
          "type": "timeseries",
          "gridPos": { "h": 7, "w": 8, "x": 8, "y": 5 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "rate(private_relay_requests_failed_total[1m])", "legendFormat": "Failed" },
            { "expr": "rate(private_relay_destination_connect_failures_total[1m])", "legendFormat": "Dest Connect Fails" },
            { "expr": "rate(private_relay_protocol_violations_total[1m])", "legendFormat": "Protocol Violations" }
          ]
        },
        {
          "title": "7. Timeout Rate (timeouts/s)",
          "type": "timeseries",
          "gridPos": { "h": 7, "w": 8, "x": 16, "y": 5 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "rate(private_relay_timeouts_total[1m])", "legendFormat": "Timeouts {{role}}" }
          ]
        },
        {
          "title": "8. Traffic Volume (Bytes/sec)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "rate(private_relay_bytes_received_total[1m])", "legendFormat": "Recv B/s {{role}}" },
            { "expr": "rate(private_relay_bytes_sent_total[1m])", "legendFormat": "Sent B/s {{role}}" }
          ]
        },
        {
          "title": "9. Resource Consumption (Links & Circuits)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "private_relay_active_connections", "legendFormat": "Active Links {{role}}" },
            { "expr": "private_relay_active_circuits", "legendFormat": "Active Circuits {{role}}" },
            { "expr": "private_relay_max_circuits", "legendFormat": "Max Circuits {{role}}" }
          ]
        },
        {
          "title": "10. Exit Request Latency (p50 & p95 seconds)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "histogram_quantile(0.50, sum(rate(private_relay_request_duration_seconds_bucket[1m])) by (le))", "legendFormat": "p50 Latency (s)" },
            { "expr": "histogram_quantile(0.95, sum(rate(private_relay_request_duration_seconds_bucket[1m])) by (le))", "legendFormat": "p95 Latency (s)" }
          ]
        }
      ],
      "refresh": "5s",
      "schemaVersion": 39,
      "tags": ["private-relay", "privacy", "metrics"],
      "timezone": "browser",
      "title": "Private Relay v0.1 - Privacy-Preserving Operations",
      "version": 2
    }
