apiVersion: batch/v1
kind: Job
metadata:
  name: private-relay-client
  namespace: private-relay
  labels:
    app.kubernetes.io/name: private-relay
    app.kubernetes.io/component: client
spec:
  backoffLimit: 12
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: private-relay
        app.kubernetes.io/component: client
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relay-client
          image: private-relay:v0.1
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/relay-client"]
          args:
            - "--config"
            - "/cfg/client.toml"
            - "--url"
            - "http://private-relay-destination.private-relay.svc.cluster.local:9000/health"
            - "--print-body"
            - "--log-level"
            - "info"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "25m"
              memory: "16Mi"
            limits:
              cpu: "200m"
              memory: "64Mi"
          # Client mounts ONLY public descriptors & timeouts; zero relay private keys.
          volumeMounts:
            - name: client-config
              mountPath: /cfg
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: client-config
          configMap:
            name: private-relay-client-config
            defaultMode: 0440
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
