apiVersion: apps/v1
kind: Deployment
metadata:
  name: private-relay-middle
  namespace: private-relay
  labels:
    app.kubernetes.io/name: private-relay
    app.kubernetes.io/component: middle
spec:
  # Single replica required in v0.1: static X25519 identity and stateful CircuitTable live per Pod.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: private-relay
      app.kubernetes.io/component: middle
  template:
    metadata:
      labels:
        app.kubernetes.io/name: private-relay
        app.kubernetes.io/component: middle
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relay-middle
          image: private-relay:v0.1
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/relay-middle"]
          args: ["--config", "/cfg/middle.toml", "--log-level", "info"]
          ports:
            - name: relay-middle
              containerPort: 9102
              protocol: TCP
          startupProbe:
            exec:
              command:
                - /usr/local/bin/relay-client
                - --probe-noise
                - 127.0.0.1:9102
                - --pubkey-toml
                - /cfg/middle.toml
            initialDelaySeconds: 1
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 10
          readinessProbe:
            exec:
              command:
                - /usr/local/bin/relay-client
                - --probe-noise
                - 127.0.0.1:9102
                - --pubkey-toml
                - /cfg/middle.toml
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/usr/local/bin/relay-client", "--probe", "127.0.0.1:9102"]
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          volumeMounts:
            - name: middle-config
              mountPath: /cfg/middle.toml
              subPath: middle.toml
              readOnly: true
            - name: middle-secret
              mountPath: /run/secrets/private_key_hex
              subPath: private_key_hex
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: middle-config
          configMap:
            name: private-relay-middle-config
            defaultMode: 0440
        - name: middle-secret
          secret:
            secretName: private-relay-middle-secret
            defaultMode: 0440
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
