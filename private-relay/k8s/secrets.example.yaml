# EXAMPLE TEMPLATE ONLY — DO NOT COMMIT REAL X25519 PRIVATE KEYS TO GIT.
# Intentionally excluded from kustomization.yaml so static placeholders cannot
# accidentally be deployed or mixed up with generated cluster identities.
#
# Prefer generating keys via `keygen-job.yaml` or running `relay-keygen` out-of-band:
#   kubectl create secret generic private-relay-entry-secret -n private-relay --from-file=private_key_hex=./entry/entry.key
#   kubectl create secret generic private-relay-middle-secret -n private-relay --from-file=private_key_hex=./middle/middle.key
#   kubectl create secret generic private-relay-exit-secret -n private-relay --from-file=private_key_hex=./exit/exit.key
apiVersion: v1
kind: Secret
metadata:
  name: private-relay-entry-secret
  namespace: private-relay
type: Opaque
stringData:
  private_key_hex: "REPLACE_WITH_64_HEX_ENTRY_PRIVATE_KEY"
---
apiVersion: v1
kind: Secret
metadata:
  name: private-relay-middle-secret
  namespace: private-relay
type: Opaque
stringData:
  private_key_hex: "REPLACE_WITH_64_HEX_MIDDLE_PRIVATE_KEY"
---
apiVersion: v1
kind: Secret
metadata:
  name: private-relay-exit-secret
  namespace: private-relay
type: Opaque
stringData:
  private_key_hex: "REPLACE_WITH_64_HEX_EXIT_PRIVATE_KEY"
