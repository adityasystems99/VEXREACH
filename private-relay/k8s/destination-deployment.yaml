apiVersion: apps/v1
kind: Deployment
metadata:
  name: private-relay-destination
  namespace: private-relay
  labels:
    app.kubernetes.io/name: private-relay
    app.kubernetes.io/component: destination
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: private-relay
      app.kubernetes.io/component: destination
  template:
    metadata:
      labels:
        app.kubernetes.io/name: private-relay
        app.kubernetes.io/component: destination
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: demo-dest
          image: private-relay:v0.1
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/demo-dest"]
          args: ["--listen", "0.0.0.0:9000"]
          ports:
            - name: http-dest
              containerPort: 9000
              protocol: TCP
          readinessProbe:
            exec:
              command: ["/usr/local/bin/relay-client", "--probe-http", "127.0.0.1:9000"]
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/usr/local/bin/relay-client", "--probe", "127.0.0.1:9000"]
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "25m"
              memory: "16Mi"
            limits:
              cpu: "200m"
              memory: "64Mi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
