apiVersion: v1
kind: ServiceAccount
metadata:
  name: private-relay-keygen
  namespace: private-relay
  labels:
    app.kubernetes.io/name: private-relay
    app.kubernetes.io/component: keygen
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: private-relay-keygen
  namespace: private-relay
  labels:
    app.kubernetes.io/name: private-relay
    app.kubernetes.io/component: keygen
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames:
      - private-relay-entry-config
      - private-relay-middle-config
      - private-relay-exit-config
      - private-relay-client-config
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - private-relay-entry-secret
      - private-relay-middle-secret
      - private-relay-exit-secret
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: private-relay-keygen
  namespace: private-relay
  labels:
    app.kubernetes.io/name: private-relay
    app.kubernetes.io/component: keygen
subjects:
  - kind: ServiceAccount
    name: private-relay-keygen
    namespace: private-relay
roleRef:
  kind: Role
  name: private-relay-keygen
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: private-relay-keygen
  namespace: private-relay
  labels:
    app.kubernetes.io/name: private-relay
    app.kubernetes.io/component: keygen
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: private-relay
        app.kubernetes.io/component: keygen
    spec:
      restartPolicy: OnFailure
      serviceAccountName: private-relay-keygen
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: generate-identities
          image: private-relay:v0.1
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/relay-keygen"]
          args:
            - "--out-dir"
            - "/work"
            - "--entry-addr"
            - "private-relay-entry.private-relay.svc.cluster.local:9101"
            - "--middle-addr"
            - "private-relay-middle.private-relay.svc.cluster.local:9102"
            - "--exit-addr"
            - "private-relay-exit.private-relay.svc.cluster.local:9103"
            - "--entry-listen"
            - "0.0.0.0:9101"
            - "--middle-listen"
            - "0.0.0.0:9102"
            - "--exit-listen"
            - "0.0.0.0:9103"
            - "--allow-target"
            - "private-relay-destination.private-relay.svc.cluster.local:9000"
            - "--allow-private-targets-for-test"
            - "--deny-loopback"
            - "--split-dirs"
            - "--key-file-path"
            - "/run/secrets/private_key_hex"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "64Mi"
          volumeMounts:
            - name: keygen-work
              mountPath: /work
      containers:
        - name: publish-k8s-objects
          image: alpine/kubectl:1.34.1
          imagePullPolicy: IfNotPresent
          env:
            - name: HOME
              value: "/tmp"
            - name: KUBECACHEDIR
              value: "/tmp/.kube-cache"
          command: ["/bin/sh", "-ceu"]
          args:
            - |
              kubectl create configmap private-relay-entry-config -n private-relay \
                --from-file=entry.toml=/work/entry/entry.toml --dry-run=client -o yaml | kubectl apply -f -
              kubectl create configmap private-relay-middle-config -n private-relay \
                --from-file=middle.toml=/work/middle/middle.toml --dry-run=client -o yaml | kubectl apply -f -
              kubectl create configmap private-relay-exit-config -n private-relay \
                --from-file=exit.toml=/work/exit/exit.toml --dry-run=client -o yaml | kubectl apply -f -
              kubectl create configmap private-relay-client-config -n private-relay \
                --from-file=client.toml=/work/client/client.toml --dry-run=client -o yaml | kubectl apply -f -
              kubectl create secret generic private-relay-entry-secret -n private-relay \
                --from-file=private_key_hex=/work/entry/entry.key --dry-run=client -o yaml | kubectl apply -f -
              kubectl create secret generic private-relay-middle-secret -n private-relay \
                --from-file=private_key_hex=/work/middle/middle.key --dry-run=client -o yaml | kubectl apply -f -
              kubectl create secret generic private-relay-exit-secret -n private-relay \
                --from-file=private_key_hex=/work/exit/exit.key --dry-run=client -o yaml | kubectl apply -f -
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          volumeMounts:
            - name: keygen-work
              mountPath: /work
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: keygen-work
          emptyDir:
            medium: Memory
            sizeLimit: 4Mi
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
