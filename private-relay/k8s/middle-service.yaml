    app.kubernetes.io/component: middle
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: private-relay
    app.kubernetes.io/component: middle
  ports:
    - name: relay-middle
      port: 9102
      targetPort: relay-middle
      protocol: TCP
