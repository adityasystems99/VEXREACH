name: Go Analyzer & Kubernetes Operator CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  go-test-and-vet:
    name: Go Static Worker & Operator (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Vet, Test & Build Go Static Reachability Worker
        working-directory: packages/core/analysis/go_worker
        run: |
          go vet ./...
          go test -v ./...
          go build ./cmd/vexreach-go-analyze

      - name: Vet, Test & Build VEXReach Kubernetes Operator
        working-directory: operators/vexreach-operator
        run: |
          go vet ./...
          go test -v ./...
          go build ./cmd/manager
