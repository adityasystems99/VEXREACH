apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-vexreach-api
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: vexreach-api
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: 8000
