apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-vexreach
  namespace: {{ .Release.Namespace }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-vexreach-role
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ["vexreach.security.io"]
    resources: ["vulnerabilityassessments", "vulnerabilityassessments/status"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-vexreach-binding
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-vexreach
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-vexreach-role
  apiGroup: rbac.authorization.k8s.io
