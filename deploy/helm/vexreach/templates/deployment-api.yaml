apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-vexreach-api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: vexreach-api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: vexreach-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vexreach-api
    spec:
      serviceAccountName: {{ .Release.Name }}-vexreach
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          env:
            - name: VEXREACH_LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: VEXREACH_LLM_PROVIDER
              value: {{ .Values.config.llmProvider | quote }}
            - name: VEXREACH_API_AUTH_ENABLED
              value: {{ .Values.config.apiAuthEnabled | quote }}
            - name: VEXREACH_API_RATE_LIMIT_PER_MINUTE
              value: {{ .Values.config.rateLimitPerMinute | quote }}
            - name: VEXREACH_KUBERNETES_ENABLED
              value: {{ .Values.config.kubernetesEnabled | quote }}
            - name: VEXREACH_KUBERNETES_NAMESPACE
              value: {{ .Release.Namespace | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/vexreach
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
