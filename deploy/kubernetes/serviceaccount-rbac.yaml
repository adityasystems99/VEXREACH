# Strict namespace-scoped least-privilege RBAC (never grants cluster-admin or cross-namespace secrets)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vexreach-worker
  namespace: vexreach
  labels:
    app.kubernetes.io/name: vexreach
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vexreach-worker-role
  namespace: vexreach
rules:
  - apiGroups: ["vexreach.security.io"]
    resources: ["vulnerabilityassessments", "vulnerabilityassessments/status"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vexreach-worker-binding
  namespace: vexreach
subjects:
  - kind: ServiceAccount
    name: vexreach-worker
    namespace: vexreach
roleRef:
  kind: Role
  name: vexreach-worker-role
  apiGroup: rbac.authorization.k8s.io
