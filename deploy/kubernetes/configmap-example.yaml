apiVersion: v1
kind: ConfigMap
metadata:
  name: vexreach-config
  namespace: vexreach
data:
  VEXREACH_LOG_LEVEL: "INFO"
  VEXREACH_STORAGE_PATH: "/var/lib/vexreach/vexreach.db"
  VEXREACH_DEFAULT_OUTPUT_DIR: "/var/lib/vexreach/assessments"
  VEXREACH_KUBERNETES_ENABLED: "true"
  VEXREACH_KUBERNETES_NAMESPACE: "vexreach"
  VEXREACH_LLM_PROVIDER: "disabled"
  VEXREACH_API_AUTH_ENABLED: "true"
  VEXREACH_API_RATE_LIMIT_PER_MINUTE: "120"
