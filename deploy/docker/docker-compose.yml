# VEXReach Local Backend Composition (REST API + Optional Isolated Scanner Worker)
# Copy ../../.env.example to .env and configure VEXREACH_API_KEYS / LLM credentials before starting.

services:
  vexreach-api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: vexreach-api
    env_file:
      - path: ../../.env
        required: false
    environment:
      VEXREACH_STORAGE_PATH: /var/lib/vexreach/vexreach.db
      VEXREACH_DEFAULT_OUTPUT_DIR: /var/lib/vexreach/assessments
      VEXREACH_LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - vexreach_data:/var/lib/vexreach
      # Mount target repositories read-only when running API-triggered local scans:
      - ../../examples:/workspace/examples:ro
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  vexreach-worker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    profiles: ["worker"]
    entrypoint: ["python", "-m", "apps.cli.main"]
    command: ["check-config"]
    environment:
      VEXREACH_STORAGE_PATH: /var/lib/vexreach/vexreach.db
      VEXREACH_DEFAULT_OUTPUT_DIR: /var/lib/vexreach/assessments
    volumes:
      - vexreach_data:/var/lib/vexreach
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  vexreach_data:
